<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your StoryNest account.">
  <title>Sign In | StoryNest</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/nav.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">StoryNest<span>.</span></a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="explore.html">Explore Stories</a>
      <a href="create.html">Write a Story</a>
    </nav>
    <div class="account-nav">
      <a class="active" href="login.html">Sign in</a>
      <a class="button button-primary" href="signup.html">Join StoryNest</a>
    </div>
  </header>

  <main class="auth-container">
    <section class="auth-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Sign in to <span>StoryNest.</span></h1>
      <p class="auth-description">
        Your next favorite story is waiting for you.
      </p>

      <form id="login-form" class="publish-form">
        <div class="form-field">
          <label for="login-email">Email address</label>
          <input
            id="login-email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="form-field">
          <label for="login-password">Password</label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >
        </div>

        <button id="login-button" class="button button-primary auth-submit" type="submit">
          Sign In
        </button>

        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">
        New to StoryNest? <a class="text-link" href="signup.html">Create an account</a>
      </p>
      <p class="auth-switch">
        <a class="text-link" href="index.html">â† Back to home</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <a class="logo" href="index.html">StoryNest<span>.</span></a>
    <p>A little corner of the internet for big imaginations.</p>
    <p>&copy; <span id="current-year"></span> StoryNest</p>
  </footer>
</body>
</html>
